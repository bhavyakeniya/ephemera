name: ci
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
          cache: true
      - name: vet
        run: go vet ./...
      - name: test
        run: go test -race -count=1 ./...
      - name: build
        run: go build ./...
      # The dependency backlog is the root cause here, not any single CVE:
      # without this gate, stale modules only surface when someone audits by
      # hand. Fails the build on a vulnerability reachable from our code.
      - name: govulncheck
        run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27'
      # golangci-lint is intentionally omitted: its action's version resolver
      # pins a linter built against an older Go toolchain that can't analyze
      # this module's Go version. gofmt + vet give a reliable signal without
      # the version-compatibility roulette. Re-add golangci-lint with an
      # explicitly pinned, Go-compatible action/linter pair when available.
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then echo "gofmt needed on:"; echo "$unformatted"; exit 1; fi
      - name: go vet
        run: go vet ./...
