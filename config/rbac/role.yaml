---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ephemera-manager
rules:
- apiGroups:
  - ""
  resources:
  - namespaces
  verbs:
  - delete
  - get
  - list
  - watch
- apiGroups:
  - ephemera.dev
  resources:
  - ttlpolicies
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - ephemera.dev
  resources:
  - ttlpolicies/status
  verbs:
  - get
  - patch
  - update
