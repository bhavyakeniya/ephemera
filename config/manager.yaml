apiVersion: v1
kind: Namespace
metadata:
  name: ephemera-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ephemera-manager
  namespace: ephemera-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ephemera-manager
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: ephemera-manager
subjects:
  - kind: ServiceAccount
    name: ephemera-manager
    namespace: ephemera-system
---
# Namespaced access only — deliberately NOT cluster-wide: webhook Secrets plus
# the Lease/Events needed for leader election, all in the controller's namespace.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ephemera-manager
  namespace: ephemera-system
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get"]
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ephemera-manager
  namespace: ephemera-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: ephemera-manager
subjects:
  - kind: ServiceAccount
    name: ephemera-manager
    namespace: ephemera-system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ephemera-manager
  namespace: ephemera-system
  labels:
    app.kubernetes.io/name: ephemera
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: ephemera
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ephemera
    spec:
      serviceAccountName: ephemera-manager
      securityContext:
        runAsNonRoot: true
      containers:
        - name: manager
          image: ephemera:latest
          imagePullPolicy: IfNotPresent
          args:
            - --metrics-bind-address=:8080
            - --health-probe-bind-address=:8081
          env:
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          ports:
            - name: metrics
              containerPort: 8080
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8081
            initialDelaySeconds: 10
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8081
            initialDelaySeconds: 5
          resources:
            requests:
              cpu: 10m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
